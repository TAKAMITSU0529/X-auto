<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="X AUTO">
  <title>X AUTO</title>
  <!--
    maskable 用。Android は円や角丸で切り抜くため、ロックアップ全体だと
    文字が欠ける。中央の安全領域 (直径80%) に収まる X マークだけにする。
  -->
  <defs>
    <linearGradient id="mk-silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#eef2f7" />
      <stop offset="62%" stop-color="#aeb8c6" />
      <stop offset="100%" stop-color="#dfe6ee" />
    </linearGradient>

    <radialGradient id="mk-bg" cx="0.5" cy="0.46" r="0.6">
      <stop offset="0%" stop-color="#12376e" />
      <stop offset="45%" stop-color="#061224" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <linearGradient id="mk-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a72ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#7cc7ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0a72ff" stop-opacity="0" />
    </linearGradient>

    <filter id="mk-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#000000" />
  <rect width="512" height="512" fill="url(#mk-bg)" />

  <!-- X マーク (92x78) を 2.3倍にして中央へ。安全領域の内側に収まる -->
  <g transform="translate(150 166) scale(2.3)">
    <path
      d="M74.6 0h13.2L58.9 33.1 92 78h-26.2l-20.9-27.3L21 78H7.7l30.9-35.3L6.9 0h27.3l18.9 25zM70 70.1h7.3L29.1 7.5h-7.9z"
      fill="none"
      stroke="url(#mk-silver)"
      stroke-width="2.6"
      stroke-linejoin="round"
    />
  </g>

  <rect x="106" y="352" width="300" height="2" fill="url(#mk-beam)" filter="url(#mk-glow)" />
</svg>
