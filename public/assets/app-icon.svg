<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="X AUTO">
  <title>X AUTO</title>
  <defs>
    <linearGradient id="ic-silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#eef2f7" />
      <stop offset="62%" stop-color="#aeb8c6" />
      <stop offset="100%" stop-color="#dfe6ee" />
    </linearGradient>

    <linearGradient id="ic-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd4ff" />
      <stop offset="100%" stop-color="#0a72ff" />
    </linearGradient>

    <linearGradient id="ic-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a72ff" stop-opacity="0" />
      <stop offset="30%" stop-color="#39a9ff" stop-opacity="0.8" />
      <stop offset="52%" stop-color="#cfeaff" stop-opacity="1" />
      <stop offset="74%" stop-color="#39a9ff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0a72ff" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="ic-flare" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#7cc7ff" />
      <stop offset="100%" stop-color="#0a72ff" stop-opacity="0" />
    </radialGradient>

    <!-- 背景の青い発光。真っ黒よりも奥行きが出る -->
    <radialGradient id="ic-bg" cx="0.5" cy="0.47" r="0.54">
      <stop offset="0%" stop-color="#0e2f60" />
      <stop offset="42%" stop-color="#050f1e" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <filter id="ic-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#000000" />
  <rect width="512" height="512" fill="url(#ic-bg)" />

  <!-- ロックアップ (520x150) を中央に配置 -->
  <g transform="translate(28 218) scale(0.877)">
    <g transform="translate(12 16) scale(1.36)">
      <path
        d="M74.6 0h13.2L58.9 33.1 92 78h-26.2l-20.9-27.3L21 78H7.7l30.9-35.3L6.9 0h27.3l18.9 25zM70 70.1h7.3L29.1 7.5h-7.9z"
        fill="none"
        stroke="url(#ic-silver)"
        stroke-width="2.4"
        stroke-linejoin="round"
      />
    </g>

    <g transform="translate(-16 0)" fill="url(#ic-silver)" fill-rule="evenodd">
      <path d="M180 122 L212 44 L228 44 L260 122 L242 122 L235.5 104 L204.5 104 L198 122 Z M209.5 90 L230.5 90 L220 62 Z" />
      <path d="M276 44 L292 44 L292 98 L297 105 L323 105 L328 98 L328 44 L344 44 L344 104 L332 122 L288 122 L276 104 Z" />
      <path d="M360 44 L428 44 L428 60 L402 60 L402 122 L386 122 L386 60 L360 60 Z" />
      <path d="M456 44 L500 44 L512 58 L512 108 L500 122 L456 122 L444 108 L444 58 Z M459 60 L497 60 L501 65 L501 101 L497 106 L459 106 L455 101 L455 65 Z" />
    </g>

    <path d="M193.5 90 L214.5 90 L204 62 Z" fill="url(#ic-blue)" />

    <ellipse cx="462" cy="83" rx="15" ry="5" fill="url(#ic-flare)" opacity="0.95" />
    <circle cx="462" cy="83" r="3.2" fill="#ffffff" opacity="0.95" filter="url(#ic-glow)" />
  </g>

  <!-- 下端の光の筋。アイコンの幅いっぱいに走らせる -->
  <rect x="0" y="330" width="512" height="1.6" fill="url(#ic-beam)" filter="url(#ic-glow)" />
</svg>
